name: Apply compile fixes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix NGSettingsActivity and ProfileActivity
        run: |
          python3 << 'END'
          from pathlib import Path

          p = Path("TMessagesProj/src/main/java/org/telegram/ui/NGSettingsActivity.java")
          t = p.read_text()

          # 1) Click handler (first occurrence only)
          a = """                } else                 if (position == rowHidePhoneNumber) {
                    cfg.setHidePhoneNumberEnabled(!cfg.isHidePhoneNumberEnabled());
                    c.setChecked(cfg.isHidePhoneNumberEnabled());
                    BulletinFactory.of(NGSettingsActivity.this).createSimpleBulletin(R.raw.done, cfg.isHidePhoneNumberEnabled() ? "Phone Privacy Enabled" : "Phone Privacy Disabled").show();
                } else if (position == rowThemeMode) {"""
          b = """                } else if (position == rowHidePhoneNumber) {
                    cfg.setHidePhoneNumberEnabled(checked);
                    cell.setChecked(checked);
                    BulletinFactory.of(this).createSimpleBulletin(R.raw.done, checked ? "Phone Privacy Enabled" : "Phone Privacy Disabled").show();
                } else if (position == rowThemeMode) {"""
          if a not in t:
              raise SystemExit("NG click pattern missing")
          t = t.replace(a, b, 1)

          # 2) Feature detail sheet
          a = """        } else                 if (position == rowHidePhoneNumber) {
                    cfg.setHidePhoneNumberEnabled(!cfg.isHidePhoneNumberEnabled());
                    c.setChecked(cfg.isHidePhoneNumberEnabled());
                    BulletinFactory.of(NGSettingsActivity.this).createSimpleBulletin(R.raw.done, cfg.isHidePhoneNumberEnabled() ? "Phone Privacy Enabled" : "Phone Privacy Disabled").show();
                } else if (position == rowThemeMode) {
                    int nextMode = (cfg.getAppThemeMode() + 1) % 3;
                    cfg.setAppThemeMode(nextMode);
                    if (listAdapter != null) listAdapter.notifyDataSetChanged();
                    String modeName = nextMode == NayaConfig.THEME_MODE_LIGHT ? "Light Slate" : (nextMode == NayaConfig.THEME_MODE_NEON_AURORA ? "Naya Neon Aurora (Cyan-Purple)" : "Dark Slate Blue");
                    BulletinFactory.of(NGSettingsActivity.this).createSimpleBulletin(R.raw.done, "Theme: " + modeName).show();
                } else if (position == rowShowIdDc) {
            title = "User ID & DC Display";"""
          b = """        } else if (position == rowHidePhoneNumber) {
            title = "Screen Share Phone Privacy";
            body = "Blurs or masks your phone number while screen sharing when enabled.\\n\\nThis is a local display preference on your device.";
        } else if (position == rowThemeMode) {
            title = "Naya Theme Mode";
            body = "Cycles between Light Slate, Dark Slate Blue, and Naya Neon Aurora themes on this device.";
        } else if (position == rowShowIdDc) {
            title = "User ID & DC Display";"""
          if a not in t:
              raise SystemExit("NG sheet pattern missing")
          t = t.replace(a, b, 1)

          # 3) onBindViewHolder mixed click code
          a = """                } else if (position == rowOneTimeVoiceVideo) {
                    cfg.setOneTimeVoiceVideoEnabled(checked);
                    cell.setChecked(checked);
                    BulletinFactory.of(this).createSimpleBulletin(R.raw.done, "One-time voice & video: " + (checked ? "On" : "Off")).show();
                } else if (position == rowAutoAddText) {
                    cfg.setAutoAddTextEnabled(checked);
                    cell.setChecked(checked);
                    BulletinFactory.of(this).createSimpleBulletin(R.raw.done, "Auto-add text: " + (checked ? "On" : "Off")).show();
                    if (checked) showAutoAddTextConfigDialog();
                } else if (position == rowEditText) {
                    showAutoAddTextConfigDialog();
                } else if (position == rowOneTimeVoiceVideo) {
                    c.setFeature(R.drawable.msg_voice, 0xFF0284C7, "One-time voice & video", "Send voice messages and round videos as view-once by default", cfg.isOneTimeVoiceVideoEnabled(), true);
                } else if (position == rowAutoAddText) {
                    c.setFeature(R.drawable.msg_edit, 0xFF8B5CF6, "Auto-add text", "Append your text to every message you send", cfg.isAutoAddTextEnabled(), true);
                } else if (position == rowEditText) {
                    c.setActionFeature(R.drawable.msg_settings_old, 0xFF10B981, "Edit text", cfg.getAutoAddText(), false);
                } else if (position == rowStorySaver) {
                    c.setFeature(R.drawable.ic_naya_download, 0xFF8B5CF6, "Story Saver", "Download stories in original HD quality", cfg.isStorySaverEnabled(), true);

                } else if (position == rowSmartChatFolders) {
                    c.setActionFeature(R.drawable.outline_groups_24, 0xFF10B981, "Smart Chat Folders", "Create and manage Telegram chat folders", false);

                } else                 if (position == rowHidePhoneNumber) {
                    cfg.setHidePhoneNumberEnabled(!cfg.isHidePhoneNumberEnabled());
                    c.setChecked(cfg.isHidePhoneNumberEnabled());
                    BulletinFactory.of(NGSettingsActivity.this).createSimpleBulletin(R.raw.done, cfg.isHidePhoneNumberEnabled() ? "Phone Privacy Enabled" : "Phone Privacy Disabled").show();
                } else if (position == rowThemeMode) {
                    int nextMode = (cfg.getAppThemeMode() + 1) % 3;
                    cfg.setAppThemeMode(nextMode);
                    if (listAdapter != null) listAdapter.notifyDataSetChanged();
                    String modeName = nextMode == NayaConfig.THEME_MODE_LIGHT ? "Light Slate" : (nextMode == NayaConfig.THEME_MODE_NEON_AURORA ? "Naya Neon Aurora (Cyan-Purple)" : "Dark Slate Blue");
                    BulletinFactory.of(NGSettingsActivity.this).createSimpleBulletin(R.raw.done, "Theme: " + modeName).show();
                } else if (position == rowShowIdDc) {
                    c.setFeature(R.drawable.ic_naya_info, 0xFF1565C0, "User ID & DC Display", "Show Telegram ID & DataCenter in profile", cfg.isShowIdAndDc(), true);"""
          b = """                } else if (position == rowOneTimeVoiceVideo) {
                    c.setFeature(R.drawable.menu_feature_voice, 0xFF0284C7, "One-time voice & video", "Send voice messages and round videos as view-once by default", cfg.isOneTimeVoiceVideoEnabled(), true);
                } else if (position == rowAutoAddText) {
                    c.setFeature(R.drawable.msg_edit, 0xFF8B5CF6, "Auto-add text", "Append your text to every message you send", cfg.isAutoAddTextEnabled(), true);
                } else if (position == rowEditText) {
                    c.setActionFeature(R.drawable.msg_settings_old, 0xFF10B981, "Edit text", cfg.getAutoAddText(), false);
                } else if (position == rowStorySaver) {
                    c.setFeature(R.drawable.ic_naya_download, 0xFF8B5CF6, "Story Saver", "Download stories in original HD quality", cfg.isStorySaverEnabled(), true);
                } else if (position == rowSmartChatFolders) {
                    c.setActionFeature(R.drawable.outline_groups_24, 0xFF10B981, "Smart Chat Folders", "Create and manage Telegram chat folders", false);
                } else if (position == rowShowIdDc) {
                    c.setFeature(R.drawable.ic_naya_info, 0xFF1565C0, "User ID & DC Display", "Show Telegram ID & DataCenter in profile", cfg.isShowIdAndDc(), true);"""
          if a not in t:
              raise SystemExit("NG bind pattern missing")
          t = t.replace(a, b, 1)
          p.write_text(t)
          print("NGSettingsActivity OK")

          pp = Path("TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java")
          tp = pp.read_text()
          a = """            if (user != null) {
                if (user.id == 777000 || "durov".equalsIgnoreCase(user.username) || "monk".equalsIgnoreCase(user.username)) {
                    balanceView.setBalance("5,092.49");
                } else if (UserObject.isUserSelf(user)) {
                    try {
                        long stars = org.telegram.ui.Stars.StarsController.getInstance(currentAccount).getBalance(false);
                        balanceView.setBalance(stars > 0 ? LocaleController.formatNumber(stars, ',') : "0");
                    } catch (Throwable e) {
                        balanceView.setBalance("0");
                    }
                } else {
                    balanceView.setBalance("0");
                }
            }
            balanceView.setOnClickListener(v -> {
                try {
                    org.telegram.ui.Stars.StarsIntroActivity.showTransactionSheet(context, currentAccount, dialog_id, resourcesProvider);
                } catch (Throwable e) {
                    try {
                        Browser.openUrl(getParentActivity(), "https://fragment.com");
                    } catch (Throwable ignored) {}
                }
            });"""
          b = """            TLRPC.User balanceUser = getMessagesController().getUser(userId);
            if (balanceUser != null) {
                if (balanceUser.id == 777000 || "durov".equalsIgnoreCase(balanceUser.username) || "monk".equalsIgnoreCase(balanceUser.username)) {
                    balanceView.setBalance("5,092.49");
                } else if (UserObject.isUserSelf(balanceUser)) {
                    try {
                        long stars = org.telegram.ui.Stars.StarsController.getInstance(currentAccount).getBalance(false);
                        balanceView.setBalance(stars > 0 ? LocaleController.formatNumber(stars, ',') : "0");
                    } catch (Throwable e) {
                        balanceView.setBalance("0");
                    }
                } else {
                    balanceView.setBalance("0");
                }
            } else {
                balanceView.setBalance("0");
            }
            balanceView.setOnClickListener(v -> {
                try {
                    long did = dialogId != 0 ? dialogId : userId;
                    org.telegram.ui.Stars.StarsIntroActivity.showTransactionSheet(context, currentAccount, did, resourcesProvider);
                } catch (Throwable e) {
                    try {
                        Browser.openUrl(getParentActivity(), "https://fragment.com");
                    } catch (Throwable ignored) {}
                }
            });"""
          if a not in tp:
              raise SystemExit("Profile pattern missing")
          pp.write_text(tp.replace(a, b, 1))
          print("ProfileActivity OK")
          END
      - name: Commit and push
        run: |
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.local"
          git add TMessagesProj/src/main/java/org/telegram/ui/NGSettingsActivity.java TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: compile errors in NGSettingsActivity and ProfileActivity"
          git push origin HEAD:master
