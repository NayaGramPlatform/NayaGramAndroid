name: Fix VoIP SED

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix CheckBoxBase + pin + icons
        run: |
          set -e
          # 1. CheckBoxBase - cancel animator before new transition
          FILE=TMessagesProj/src/main/java/org/telegram/ui/Components/CheckBoxBase.java
          python3 -c "
          path='$FILE'
          t=open(path).read()
          old='private void animateToCheckedState(boolean newCheckedState) {\n        checkAnimator = ObjectAnimator'
          new='private void animateToCheckedState(boolean newCheckedState) {\n        cancelCheckAnimator();\n        checkAnimator = ObjectAnimator'
          if old in t:
              t=t.replace(old,new,1)
              open(path,'w').write(t)
              print('CheckBoxBase: cancelCheckAnimator injected')
          elif 'cancelCheckAnimator();' in t.split('animateToCheckedState')[1][:80]:
              print('CheckBoxBase: already fixed')
          else:
              print('CheckBoxBase: pattern miss')
          "

          # 2. Pin limit
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          python3 -c "
          import re
          path='$FILE'
          t=open(path).read()
          vals=re.findall(r'dialogFiltersPinnedLimitDefault\s*=\s*(\d+)', t)
          print('pin values before:', vals)
          t2=re.sub(r'dialogFiltersPinnedLimitDefault\s*=\s*5\b','dialogFiltersPinnedLimitDefault = 10',t)
          open(path,'w').write(t2)
          vals=re.findall(r'dialogFiltersPinnedLimitDefault\s*=\s*(\d+)', t2)
          print('pin values after:', vals)
          "

          # 3. Unlock icons
          FILE=TMessagesProj/src/main/java/org/telegram/ui/LauncherIconController.java
          python3 -c "
          path='$FILE'
          t=open(path).read()
          if 'isIconAvailable' not in t:
              insert='''\n    public static boolean isIconAvailable(LauncherIcon icon) {\n        return true;\n    }\n\n    public static boolean canUseIcon(LauncherIcon icon) {\n        return true;\n    }\n\n'''
              t=t.replace('public static void setIcon(LauncherIcon icon) {', insert+'    public static void setIcon(LauncherIcon icon) {',1)
              open(path,'w').write(t)
              print('LauncherIcon: isIconAvailable added')
          else:
              print('LauncherIcon: already has isIconAvailable')
          "

          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git status --short
          git commit -m "fix(ui): checkbox animator cancel, pin limit 10, unlock launcher icons" || echo nochange
          git push origin master
