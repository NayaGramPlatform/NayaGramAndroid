            cp -r TMessagesProj/jni/ffmpeg/include/dav1d/* TMessagesProj/jni/third_party/dav1d/include/ 2>/dev/null || true
            cp -r TMessagesProj/jni/ffmpeg/include/dav1d/* TMessagesProj/jni/third_party/dav1d/include/dav1d/ 2>/dev/null || true
