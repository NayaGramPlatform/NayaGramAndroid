name: Build NayaGram Release APK and AAB (Dual-Engine)

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Run Engine 1 (Universal Release APK)"
        required: true
        type: boolean
        default: true
      build_aab:
        description: "Run Engine 2 (Google Play AAB Bundle)"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'README*'

concurrency:
  group: build-nayagram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # ENGINE 1: Universal Signed Release APK Builder
  # =========================================================================
  build_release_apk:
    name: "Engine 1: Build Signed Release APK"
    if: ${{ github.event_name == 'push' || inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Maximize Free Disk Space (Ubuntu Runner)
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android NDK, CMake, and Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Sanitize Android Resource Files and Filenames
        run: |
          find TMessagesProj/src/main/res -name "*.png.png" | while read -r f; do
            mv "$f" "${f%.png}" 2>/dev/null || rm -f "$f"
          done
          if [ -f "TMessagesProj/src/main/res/values/strings_anti_delete.xml" ]; then
            sed -i 's/Privacy & Security/Privacy \&amp; Security/g' TMessagesProj/src/main/res/values/strings_anti_delete.xml
          fi

      - name: Link Prebuilt Native Libraries and C++ Headers
        run: |
          # 1. Prebuilt openh264 and tlottie static libraries
          mkdir -p TMessagesProj/jni/prebuild/lib
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "TMessagesProj/jni/prebuild/$abi" ]; then
              cp -r "TMessagesProj/jni/prebuild/$abi" "TMessagesProj/jni/prebuild/lib/" 2>/dev/null || true
            fi
          done

          # 2. BoringSSL / OpenSSL headers
          mkdir -p TMessagesProj/jni/third_party/boringssl
          cp -r TMessagesProj/jni/boringssl/include TMessagesProj/jni/third_party/boringssl/ 2>/dev/null || true
          mkdir -p TMessagesProj/jni/openssl
          cp -r TMessagesProj/jni/boringssl/include TMessagesProj/jni/openssl/ 2>/dev/null || true

          # 3. FFmpeg pre-configured headers (avconfig.h, etc.)
          if [ -d "TMessagesProj/jni/ffmpeg/include" ]; then
            cp -r TMessagesProj/jni/ffmpeg/include/* TMessagesProj/jni/third_party/ffmpeg/ 2>/dev/null || true
            mkdir -p TMessagesProj/jni/third_party/ffmpeg/libavutil
            cp -r TMessagesProj/jni/ffmpeg/include/libavutil/* TMessagesProj/jni/third_party/ffmpeg/libavutil/ 2>/dev/null || true

            # libvpx headers
            mkdir -p TMessagesProj/jni/third_party/libvpx/vpx
            cp -r TMessagesProj/jni/ffmpeg/include/libvpx/* TMessagesProj/jni/third_party/libvpx/ 2>/dev/null || true
            cp -r TMessagesProj/jni/ffmpeg/include/libvpx/* TMessagesProj/jni/third_party/libvpx/vpx/ 2>/dev/null || true

            # dav1d headers
            mkdir -p TMessagesProj/jni/third_party/dav1d/include/dav1d
            cp -r TMessagesProj/jni/ffmpeg/include/dav1d/* TMessagesProj/jni/third_party/dav1d/include/ 2>/dev/null || true
            cp -r TMessagesProj/jni/ffmpeg/include/dav1d/* TMessagesProj/jni/third_party/dav1d/include/dav1d/ 2>/dev/null || true
          fi

          # 4. tde2e e2e_api.h headers
          mkdir -p TMessagesProj/jni/td/tde2e/td/e2e
          if [ -d "TMessagesProj/jni/tde2e/include" ]; then
            cp -r TMessagesProj/jni/tde2e/include/* TMessagesProj/jni/td/tde2e/ 2>/dev/null || true
            cp -r TMessagesProj/jni/tde2e/include/* TMessagesProj/jni/td/tde2e/td/e2e/ 2>/dev/null || true
            cp -r TMessagesProj/jni/tde2e/include/* TMessagesProj/jni/voip/ 2>/dev/null || true
            cp -r TMessagesProj/jni/tde2e/include/* TMessagesProj/jni/ 2>/dev/null || true
          fi

      - name: Configure Keystore and Signing Secrets
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore
            echo "Keystore successfully restored from secrets."
          else
            echo "Using existing repository keystore at TMessagesProj/config/release.keystore."
          fi

          if [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> gradle.properties
          fi

          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Configure Packaging Options for Native Libraries
        run: |
          cat << 'ENDCAT' >> TMessagesProj/build.gradle
          android {
              packagingOptions {
                  resources {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
                  jniLibs {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
              }
          }
          ENDCAT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile Universal Release APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease             -Pandroid.stripDebugSymbol.enable=false             --no-daemon --stacktrace

      - name: Locate Generated APK
        if: always()
        run: |
          echo "=== APK Files Found ==="
          find . -name "*.apk" -print

      - name: Upload Signed Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Release-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  # =========================================================================
  # ENGINE 2: Google Play Signed Release AAB Bundle Builder
  # =========================================================================
  build_release_aab:
    name: "Engine 2: Build Google Play Release AAB"
    if: ${{ github.event_name == 'push' || inputs.build_aab == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Maximize Free Disk Space (Ubuntu Runner)
