name: Build NayaGram Release APK and AAB

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build Universal Release APK"
        required: true
        type: boolean
        default: true
      build_aab:
        description: "Build Google Play Store AAB Bundle"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'README*'

concurrency:
  group: build-nayagram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android NDK, CMake, and Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Ensure Prebuilt Native Libraries Paths
        run: |
          mkdir -p TMessagesProj/jni/prebuild/lib
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -d "TMessagesProj/jni/prebuild/$abi" ]; then
              cp -r "TMessagesProj/jni/prebuild/$abi" "TMessagesProj/jni/prebuild/lib/" 2>/dev/null || true
            fi
          done

      - name: Configure Keystore and Signing Secrets
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore
            echo "Keystore successfully restored from secrets."
          else
            echo "Using existing repository keystore at TMessagesProj/config/release.keystore."
          fi

          if [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> gradle.properties
            echo "Signing properties configured from secrets."
          fi

          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> gradle.properties

      - name: Configure Packaging Options for Native Libraries
        run: |
          cat << 'ENDCAT' >> TMessagesProj/build.gradle
          android {
              packagingOptions {
                  resources {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
                  jniLibs {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
              }
          }
          ENDCAT

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Signed Universal Release APK
        if: ${{ github.event_name == 'push' || inputs.build_apk == true }}
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease             -Pandroid.stripDebugSymbol.enable=false             --no-daemon --stacktrace

      - name: Build Signed Google Play AAB Bundle
        if: ${{ github.event_name == 'push' || inputs.build_aab == true }}
        run: |
          ./gradlew :TMessagesProj_App:bundleBundleAfatRelease             -Pandroid.stripDebugSymbol.enable=false             --no-daemon --stacktrace

      - name: List Generated Artifacts
        if: always()
        run: |
          echo "=== APK Files ==="
          find . -name "*.apk" -print
          echo "=== AAB Files ==="
          find . -name "*.aab" -print

      - name: Upload Signed Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Release-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Signed Google Play AAB Bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-PlayStore-AAB
          path: TMessagesProj_App/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14
