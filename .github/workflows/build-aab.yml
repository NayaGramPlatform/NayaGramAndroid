name: Build Release AAB

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Select Flavor"
        required: true
        default: "bundleBundleAfatRelease"
        type: choice
        options:
          - "bundleBundleAfatRelease"
          - "bundleBundleAfat_SDK23Release"

jobs:
  build:
    name: Build Signed Android App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android NDK, CMake, and Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Keystore and Signing Secrets
        run: |
          mkdir -p TMessagesProj/config
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > TMessagesProj/config/release.keystore
            echo "Keystore successfully restored from secrets."
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret not found."
          fi
          
          if [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> gradle.properties
            echo "Signing properties configured from secrets."
          fi
          
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build AAB
        run: ./gradlew :TMessagesProj_App:${{ inputs.flavor }} --no-daemon --stacktrace

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-PlayStore-AAB
          path: TMessagesProj_App/build/outputs/bundle/*/*.aab
          retention-days: 14
