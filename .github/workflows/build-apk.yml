name: Build NayaGram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'README*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  # Which app module actually gets built (avoids HockeyApp/Huawei/Standalone
  # variants failing for config that doesn't exist for them).
  GRADLE_MODULE: ":TMessagesProj_App"
  GRADLE_TASK: "assembleAfatDebug"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # a stuck build shouldn't burn the whole Actions quota

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # Caches ~/.gradle/caches and ~/.gradle/wrapper between runs.
          # Cuts several minutes off every build after the first.
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Required NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Create local.properties
        run: |
          {
            echo "APP_ID=0"
            echo "APP_HASH=00000000000000000000000000000000000"
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          } > local.properties

      # NOTE: if TMessagesProj/build.gradle already defines its own
      # packagingOptions block elsewhere in the file, remove/merge it
      # manually first — two packagingOptions blocks using different
      # syntax styles can conflict.
      - name: Fix Packaging Options for Gradle
        run: |
          cat << 'EOF' >> TMessagesProj/build.gradle

          android {
              packagingOptions {
                  resources {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
                  jniLibs {
                      pickFirsts.add('**/libtmessages*.so')
                      pickFirsts.add('**/*.so')
                  }
              }
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew ${GRADLE_MODULE}:${GRADLE_TASK} \
            -Pandroid.stripDebugSymbol.enable=false \
            --no-daemon \
            --stacktrace \
            --warning-mode=summary

      # Always runs (even on failure) so you instantly see whether an
      # APK exists and exactly where, instead of guessing from upload
      # errors.
      - name: List generated APKs (debug helper)
        if: always()
        run: find . -name "*.apk" -print || echo "No APK found"

      - name: Upload NayaGram APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-APK-${{ github.run_number }}
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

