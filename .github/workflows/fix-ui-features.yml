name: Fix UI Features

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply all UI/feature fixes
        run: |
          python3 << 'PY'
          import re, os

          changes = []

          # ========== 1. CheckBoxBase: cancel animator before new transition ==========
          path = "TMessagesProj/src/main/java/org/telegram/ui/Components/CheckBoxBase.java"
          with open(path, encoding="utf-8") as f:
              text = f.read()

          old_anim = '''    private void animateToCheckedState(boolean newCheckedState) {
        checkAnimator = ObjectAnimator.ofFloat(this, "progress", newCheckedState ? 1 : 0);'''

          new_anim = '''    private void animateToCheckedState(boolean newCheckedState) {
        cancelCheckAnimator();
        checkAnimator = ObjectAnimator.ofFloat(this, "progress", newCheckedState ? 1 : 0);'''

          if old_anim in text:
              text = text.replace(old_anim, new_anim, 1)
              changes.append("CheckBoxBase: cancelCheckAnimator before new animation")
          elif "cancelCheckAnimator();" in text and "animateToCheckedState" in text:
              # already has cancel somewhere near animate - ensure it's at start
              if "private void animateToCheckedState(boolean newCheckedState) {\n        cancelCheckAnimator();" not in text:
                  text = re.sub(
                      r'(private void animateToCheckedState\(boolean newCheckedState\) \{)\n(\s*)(checkAnimator = ObjectAnimator)',
                      r'\1\n\2cancelCheckAnimator();\n\2\3',
                      text,
                      count=1
                  )
                  changes.append("CheckBoxBase: injected cancelCheckAnimator via regex")
              else:
                  changes.append("CheckBoxBase: already fixed")
          else:
              changes.append("CheckBoxBase: pattern not found - SKIP")

          # Also ensure setChecked always ends with correct progress when not animated
          # (already does cancelCheckAnimator + setProgress)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          # ========== 2. Pin limit: dialogFiltersPinnedLimitDefault = 10 ==========
          path = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
          with open(path, encoding="utf-8") as f:
              text = f.read()

          # Field init and any assignment of 5 -> 10
          n1 = len(re.findall(r'dialogFiltersPinnedLimitDefault\s*=\s*5', text))
          text2 = re.sub(r'dialogFiltersPinnedLimitDefault\s*=\s*5', 'dialogFiltersPinnedLimitDefault = 10', text)
          # Also maxPinnedDialogsCount patterns if any
          text2 = re.sub(r'maxPinnedDialogsCount\s*=\s*5', 'maxPinnedDialogsCount = 10', text2)
          text2 = re.sub(r'getMaxPinnedDialogsCount\(\)\s*\{\s*return\s+5;', 'getMaxPinnedDialogsCount() { return 10;', text2)

          if text2 != text:
              changes.append(f"MessagesController: pin limit 5->10 ({n1} field assignments)")
              text = text2
          else:
              # Check current value
              m = re.search(r'dialogFiltersPinnedLimitDefault\s*=\s*(\d+)', text)
              if m:
                  changes.append(f"MessagesController: pin limit currently = {m.group(1)}")
                  if m.group(1) != '10':
                      text = re.sub(r'dialogFiltersPinnedLimitDefault\s*=\s*\d+', 'dialogFiltersPinnedLimitDefault = 10', text, count=1)
                      changes.append("MessagesController: forced pin limit to 10")
              else:
                  changes.append("MessagesController: dialogFiltersPinnedLimitDefault not found")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          # ========== 3. LauncherIconController: all icons free, one premium badge ==========
          path = "TMessagesProj/src/main/java/org/telegram/ui/LauncherIconController.java"
          with open(path, encoding="utf-8") as f:
              text = f.read()

          # Keep PREMIUM icon with premium=true as badge only; ensure all others are false
          # User asked: 1 premium, rest unlocked. Already only PREMIUM has true.
          # Add isIconAvailable that always returns true so UI never blocks.
          if "isIconAvailable" not in text:
              insert = '''
    /** All custom launcher icons are available to free users. Premium flag is only a badge. */
    public static boolean isIconAvailable(LauncherIcon icon) {
        return true;
    }

    public static boolean canUseIcon(LauncherIcon icon) {
        return true;
    }
'''
              text = text.replace(
                  "public static void setIcon(LauncherIcon icon) {",
                  insert + "\n    public static void setIcon(LauncherIcon icon) {",
                  1
              )
              changes.append("LauncherIconController: added isIconAvailable/canUseIcon always true")
          else:
              changes.append("LauncherIconController: isIconAvailable already present")

          # Ensure only PREMIUM has premium=true; others false
          # Pattern: PREMIUM(..., true) stays; any other ..., true) -> false except PREMIUM line
          lines = text.splitlines(keepends=True)
          new_lines = []
          for line in lines:
              if "PREMIUM(" in line and ", true)" in line:
                  new_lines.append(line)  # keep premium badge
              elif re.search(r'LauncherIcon\(|VINTAGE\(|AQUA\(|TURBO\(|NOX\(|DEFAULT\(', line) and ", true)" in line:
                  new_lines.append(line.replace(", true)", ", false)"))
                  changes.append(f"Unlocked icon line: {line.strip()[:60]}")
              else:
                  new_lines.append(line)
          text = "".join(new_lines)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          # ========== 4. Settings tips link fallback ==========
          # Search SettingsActivity and ProfileActivity / similar
          for settings_path in [
              "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java",
              "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java",
              "TMessagesProj/src/main/java/org/telegram/ui/NGSettingsActivity.java",
          ]:
              if not os.path.exists(settings_path):
                  continue
              with open(settings_path, encoding="utf-8") as f:
                  s = f.read()
              original = s

              # Common patterns for tips row click
              # Replace broken internal browser with Intent fallback + openByUserName
              if "TelegramTips" in s or "telegram_tips" in s.lower() or "Tips" in s:
                  # Inject a helper method if not present
                  if "openTelegramTipsFallback" not in s:
                      helper = '''
    private void openTelegramTipsFallback() {
        try {
            android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse("https://t.me/TelegramTips"));
            intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
            getParentActivity().startActivity(intent);
        } catch (Throwable e) {
            try {
                getMessagesController().openByUserName("TelegramTips", this, 1);
            } catch (Throwable ignored) {
            }
        }
    }
'''
                      # Insert before last closing brace of class
                      last = s.rfind("}")
                      if last > 0:
                          s = s[:last] + helper + "\n" + s[last:]
                          changes.append(f"{settings_path}: added openTelegramTipsFallback")

                  # Try to wire faqRow / tipsRow / featuresRow clicks
                  # Replace Browser.openUrl(...Tips...) patterns
                  s2 = re.sub(
                      r'Browser\.openUrl\([^;]*TelegramTips[^;]*\);',
                      'openTelegramTipsFallback();',
                      s
                  )
                  if s2 != s:
                      s = s2
                      changes.append(f"{settings_path}: replaced Browser.openUrl Tips with fallback")

              if s != original:
                  with open(settings_path, "w", encoding="utf-8") as f:
                      f.write(s)

          # Also search faqRow click in SettingsActivity more carefully
          path = "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  s = f.read()
              # Look for faqRow or tipsRow position checks
              if "faqRow" in s and "openTelegramTipsFallback" in s:
                  # If faq opens something broken, we already have helper
                  changes.append("SettingsActivity: faqRow present, helper available")
              # Search for t.me/TelegramTips without fallback
              if "t.me/TelegramTips" in s and "openTelegramTipsFallback" not in s:
                  changes.append("SettingsActivity: has Tips URL but no helper yet")

          # ========== 5. Soft-fix selection: document ChatActivity pattern ==========
          # ChatActivity is huge; ensure CheckBoxBase fix is the main tick-freeze fix.
          # MediaActivity/ChatActivity rely on CheckBox2 -> CheckBoxBase.

          print("=== CHANGES ===")
          for c in changes:
              print(" -", c)
          if not changes:
              print(" - (none)")
          PY

          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git status --short | head -30
          git commit -m "fix(ui): checkbox animator cancel, pin limit 10, unlock icons, tips fallback" || echo nochange
          git push origin master
