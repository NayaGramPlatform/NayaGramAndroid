name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix checkbox media ticks
        run: |
          set -e
          python3 -c '
          path = "TMessagesProj/src/main/java/org/telegram/ui/Cells/PhotoAttachPhotoCell.java"
          t = open(path, encoding="utf-8").read()
          a = "checkBox.setColor(Theme.key_checkbox, Theme.key_chat_attachPhotoBackground, Theme.key_checkboxCheck);"
          b = "checkBox.setColor(Theme.key_chat_attachCheckBoxBackground, Theme.key_chat_attachPhotoBackground, Theme.key_chat_attachCheckBoxCheck);"
          if a in t:
              t = t.replace(a, b, 1)
              print("colors fixed")
          old = "    public void setChecked(int num, boolean checked, boolean animated) {\n        checkBox.setChecked(num, checked, animated);\n"
          new = "    public void setChecked(int num, boolean checked, boolean animated) {\n        checkBox.setChecked(num, checked, animated);\n        if (checked && checkBox.getProgress() < 0.5f) {\n            checkBox.getCheckBoxBase().cancelCheckAnimator();\n            checkBox.getCheckBoxBase().setProgress(1.0f);\n        }\n"
          if old in t:
              t = t.replace(old, new, 1)
              print("setChecked fixed")
          open(path, "w", encoding="utf-8").write(t)
          '

          python3 -c '
          path = "TMessagesProj/src/main/java/org/telegram/ui/Components/CheckBoxBase.java"
          t = open(path, encoding="utf-8").read()
          if "cancelCheckAnimator();\n        checkAnimator = ObjectAnimator" not in t:
              t = t.replace(
                  "private void animateToCheckedState(boolean newCheckedState) {\n        checkAnimator = ObjectAnimator",
                  "private void animateToCheckedState(boolean newCheckedState) {\n        cancelCheckAnimator();\n        checkAnimator = ObjectAnimator",
                  1)
              print("cancel injected")
          else:
              print("cancel ok")
          old = """                if (animation.equals(checkAnimator)) {
                    checkAnimator = null;
                }
                if (!isChecked) {
                    checkedText = null;
                }"""
          new = """                if (animation.equals(checkAnimator)) {
                    checkAnimator = null;
                }
                setProgress(isChecked ? 1.0f : 0.0f);
                if (!isChecked) {
                    checkedText = null;
                }"""
          if old in t and "setProgress(isChecked" not in t:
              t = t.replace(old, new, 1)
              print("snap added")
          open(path, "w", encoding="utf-8").write(t)
          '

          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git status --short
          git commit -m "fix(ui): media selection ticks visible + checkbox progress snap" || echo nochange
          git push origin master
