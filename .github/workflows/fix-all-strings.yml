name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install prebuilt JNI runnables
        run: |
          set -e
          python3 Tools/patch_jni_runnables.py
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git diff --stat
          git commit -m "fix(startup): do not allocate inside ConnectionsManager.onUpdate" || echo nochange
          git push origin master
