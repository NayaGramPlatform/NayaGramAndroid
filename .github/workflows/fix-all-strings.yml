name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply call backdrop colors
        run: |
          set -e
          python3 Tools/patch_call_colors.py
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git diff --stat
          git commit -m "ui(call): purple blue cyan gradient behind group and private calls" || echo nochange
          git push origin master
