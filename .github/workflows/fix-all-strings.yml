name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UI fixes with Python
        run: |
          set -e
          python3 <<'ENDSCRIPT'
          from pathlib import Path

          # 1) CheckBoxBase snap
          p = Path("TMessagesProj/src/main/java/org/telegram/ui/Components/CheckBoxBase.java")
          t = p.read_text(encoding="utf-8")
          needle = """                if (animation.equals(checkAnimator)) {
                    checkAnimator = null;
                }
                if (!isChecked) {
                    checkedText = null;
                }"""
          repl = """                if (animation.equals(checkAnimator)) {
                    checkAnimator = null;
                }
                setProgress(isChecked ? 1.0f : 0.0f);
                if (!isChecked) {
                    checkedText = null;
                }"""
          if "setProgress(isChecked ? 1.0f : 0.0f)" not in t and needle in t:
              t = t.replace(needle, repl, 1)
              p.write_text(t, encoding="utf-8")
              print("CheckBoxBase: snap applied")
          else:
              print("CheckBoxBase: skip")

          # 2) SharedPhotoVideoCell force progress
          p = Path("TMessagesProj/src/main/java/org/telegram/ui/Cells/SharedPhotoVideoCell.java")
          t = p.read_text(encoding="utf-8")
          needle = """        public void setChecked(final boolean checked, boolean animated) {
            if (checkBox.getVisibility() != VISIBLE) {
                checkBox.setVisibility(VISIBLE);
            }
            checkBox.setChecked(checked, animated);
"""
          repl = """        public void setChecked(final boolean checked, boolean animated) {
            if (checkBox.getVisibility() != VISIBLE) {
                checkBox.setVisibility(VISIBLE);
            }
            checkBox.setChecked(checked, animated);
            if (checked && checkBox.getProgress() < 0.5f) {
                checkBox.getCheckBoxBase().cancelCheckAnimator();
                checkBox.getCheckBoxBase().setProgress(1.0f);
            }
"""
          if "getProgress() < 0.5f" not in t and needle in t:
              t = t.replace(needle, repl, 1)
              p.write_text(t, encoding="utf-8")
              print("SharedPhotoVideoCell: applied")
          else:
              print("SharedPhotoVideoCell: skip")

          # 3) Settings Tips fallback
          p = Path("TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java")
          t = p.read_text(encoding="utf-8")
          needle = """            case 23: {
                if (MessagesController.getInstance(currentAccount).isFrozen()) {
                    AccountFrozenAlert.show(currentAccount);
                } else {
                    Browser.openUrl(getContext(), LocaleController.getString(R.string.NayaGramFeaturesUrl));
                }
                break;
            }"""
          repl = """            case 23: {
                if (MessagesController.getInstance(currentAccount).isFrozen()) {
                    AccountFrozenAlert.show(currentAccount);
                } else {
                    String tipsUrl = LocaleController.getString(R.string.NayaGramFeaturesUrl);
                    if (tipsUrl == null || tipsUrl.length() == 0) {
                        tipsUrl = "https://t.me/TelegramTips";
                    }
                    try {
                        Browser.openUrl(getContext(), tipsUrl);
                    } catch (Throwable e1) {
                        try {
                            Browser.openUrl(getContext(), "https://t.me/TelegramTips");
                        } catch (Throwable e2) {
                            MessagesController.getInstance(currentAccount).openByUserName("TelegramTips", SettingsActivity.this, 1);
                        }
                    }
                }
                break;
            }"""
          if 'openByUserName("TelegramTips"' not in t and needle in t:
              t = t.replace(needle, repl, 1)
              p.write_text(t, encoding="utf-8")
              print("SettingsActivity: tips fallback applied")
          else:
              print("SettingsActivity: skip")

          print("DONE")
          ENDSCRIPT

          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git status --short
          git commit -m "fix(ui): checkbox snap + media ticks + Settings Tips fallback" || echo nochange
          git push origin master
