name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UI fixes
        run: |
          rm -f /tmp/fix_ui.b64
          echo "" | base64 -d > /tmp/fix_ui.py
          python3 /tmp/fix_ui.py
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git status --short
          git commit -m "fix(ui): checkbox snap + media ticks + Settings Tips fallback" || echo nochange
          git push origin master
