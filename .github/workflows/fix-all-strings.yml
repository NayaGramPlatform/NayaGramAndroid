name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard JNI startup crash
        run: |
          set -e
          python3 Tools/patch_startup_crash.py
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git diff --stat
          git commit -m "fix(startup): guard ConnectionsManager JNI callbacks and disable R8 full mode" || echo nochange
          git push origin master
