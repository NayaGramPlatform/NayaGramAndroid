name: Fix All Missing Strings

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch call crash, ID copy, version 4012
        run: |
          set -e
          python3 Tools/ci_patch_call.py
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add -A
          git diff --stat
          git commit -m "fix(call): catch VoIP crash, copy profile ID/DC, versionCode 4012" || echo nochange
          git push origin master
