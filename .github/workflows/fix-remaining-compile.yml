name: Fix remaining compile errors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-remaining-compile.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix ChatActivityEnterView + ProfileActivity
        run: |
          python3 << 'END'
          from pathlib import Path

          p = Path("TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java")
          t = p.read_text()

          marker = "            } catch (Exception ignore) {}\n"
          key = "isAutoAddTextEnabled"
          i = t.find(key)
          if i < 0:
              raise SystemExit("auto-add key not found")
          j = t.find(marker, i)
          if j < 0:
              raise SystemExit("auto-add catch marker not found")
          insert_at = j + len(marker)
          insertion = "            final CharSequence messageForSend = message;\n"
          if "messageForSend" not in t[i:i+1200]:
              t = t[:insert_at] + insertion + t[insert_at:]
              print("inserted messageForSend")
          else:
              print("messageForSend already present")

          # Only the lambda uses deeper indent (28 spaces before delegate)
          old_call = "                            delegate.onMessageSend(message, notify, scheduleDate, scheduleRepeatPeriod, payStars);"
          new_call = "                            delegate.onMessageSend(messageForSend, notify, scheduleDate, scheduleRepeatPeriod, payStars);"
          if old_call not in t:
              raise SystemExit("lambda onMessageSend not found")
          t = t.replace(old_call, new_call, 1)
          p.write_text(t)
          print("ChatActivityEnterView OK")

          pp = Path("TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java")
          tp = pp.read_text()
          needle = "org.telegram.ui.Stars.StarsIntroActivity.showTransactionSheet(context, currentAccount, did, resourcesProvider);"
          if needle not in tp:
              if "Browser.openUrl(getParentActivity(), \"https://fragment.com\")" in tp and "balanceView.setOnClickListener" in tp:
                  print("Profile already simplified")
              else:
                  raise SystemExit("Profile showTransactionSheet not found")
          else:
              # Replace whole balance click listener block via anchors
              start = tp.find("balanceView.setOnClickListener")
              if start < 0:
                  raise SystemExit("balanceView.setOnClickListener not found")
              # find end of this listener - next ");\n" after start that closes it
              end = tp.find("});", start)
              if end < 0:
                  raise SystemExit("balance click end not found")
              end = end + 3
              new_block = '''balanceView.setOnClickListener(v -> {
                try {
                    Browser.openUrl(getParentActivity(), "https://fragment.com");
                } catch (Throwable ignored) {}
            });'''
              # preserve leading spaces of start line
              line_start = tp.rfind("\n", 0, start) + 1
              indent = tp[line_start:start]
              tp = tp[:line_start] + indent + new_block + tp[end:]
              pp.write_text(tp)
              print("ProfileActivity OK")
          END
      - name: Commit and push
        run: |
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.local"
          git add TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java \
                  TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: ChatActivityEnterView lambda final + ProfileActivity balance click compile errors"
          git push origin HEAD:master
