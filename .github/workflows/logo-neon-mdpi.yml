name: logo-neon-mdpi
on:
  workflow_dispatch:
jobs:
  i:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python3 << 'EOF'
          import base64, os
          raw = base64.b64decode("")
          folder = "TMessagesProj/src/main/res/mipmap-mdpi"
          os.makedirs(folder, exist_ok=True)
          for name in ['ic_launcher.png', 'ic_launcher_round.png', 'icon_5_launcher.png', 'icon_5_launcher_round.png', 'icon_foreground.png', 'icon_foreground_round.png', 'icon_foreground_sa.png']:
              open(f"{folder}/{name}", "wb").write(raw)
              print("wrote", name, len(raw))
          EOF
      - run: |
          git config user.name "NayaGram CI"
          git config user.email "ci@nayagram.platform"
          git add TMessagesProj/src/main/res/mipmap-mdpi/
          git commit -m "assets: neon mdpi icons" || echo nochange
          git push origin master
