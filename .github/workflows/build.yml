name: Build NayaGram AAB & APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed AAB and APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Inspect Android SDK Environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/ndk || true
          ls -la $ANDROID_HOME/cmake || true
          ls -la $ANDROID_HOME/platforms || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release AAB (Google Play Bundle)
        run: ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release --stacktrace

      - name: Build Release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload NayaGram Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Release-AAB
          path: TMessagesProj_App/build/outputs/bundle/bundleAfat_SDK23Release/*.aab

      - name: Upload NayaGram Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NayaGram-Release-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
