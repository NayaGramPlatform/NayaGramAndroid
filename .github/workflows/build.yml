name: Build NayaGram AAB & APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore & Fix VoIPHelper.java (compile error)
        run: |
          # Last known-good content before accidental overwrite, then fix isVideo typo
          GOOD_SHA=3a002cafdc33c9b41913da2f7ad18ef61d423589
          TARGET=TMessagesProj/src/main/java/org/telegram/ui/Components/voip/VoIPHelper.java
          if git cat-file -e ${GOOD_SHA}:${TARGET} 2>/dev/null; then
            git show ${GOOD_SHA}:${TARGET} > "$TARGET"
            # Fix: isVideo was never declared — parameter is videoCall
            sed -i 's/user != null ? user.id : 0, isVideo)/user != null ? user.id : 0, videoCall)/g' "$TARGET"
            # Safety: if still broken, strip the diagnostic try/catch block
            if grep -q 'isVideo)' "$TARGET"; then
              python3 - <<'PY'
import re, pathlib
p = pathlib.Path("TMessagesProj/src/main/java/org/telegram/ui/Components/voip/VoIPHelper.java")
t = p.read_text()
t = re.sub(
    r"\n\s*try \{\n\s*org\.nayagram\.platform\.diagnostics\.VoIPCrashDiagnostics\.logCallState\([^;]+;\n\s*\} catch \(Throwable t\) \{\n\s*org\.nayagram\.platform\.diagnostics\.VoIPCrashDiagnostics\.logNativeFailure\([^;]+;\n\s*\}\n",
    "\n",
    t,
)
p.write_text(t)
print("Stripped diagnostic block")
PY
            fi
            echo "VoIPHelper restored and fixed"
            grep -n "startCall(TLRPC.User" "$TARGET" | head -3
            wc -c "$TARGET"
          else
            echo "::error::Could not find good VoIPHelper blob"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate CI-Only Test Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/nayagrampro.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -alias nayagrampro_key \
            -storepass 'NayaGramCI@Test2026' \
            -keypass 'NayaGramCI@Test2026' \
            -dname "CN=NayaGram CI Test, OU=CI, O=NayaGram Platform, L=Rangpur, ST=Rangpur, C=BD"
          ls -la TMessagesProj/config/nayagrampro.jks

      - name: Run C++ Account Boundary Tests
        run: |
          if [ -f TMessagesProj/jni/tgnet/test_account_boundary.cpp ]; then
            g++ -std=c++17 -I TMessagesProj/jni/tgnet TMessagesProj/jni/tgnet/test_account_boundary.cpp -o test_account_boundary
            ./test_account_boundary || echo "::warning::C++ test failed"
          fi
          if [ -f tools/test_account_boundary.py ]; then
            python3 tools/test_account_boundary.py || echo "::warning::Python test failed"
          fi

      - name: Run Java Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:testDebugUnitTest --tests "org.telegram.messenger.AccountBoundaryRuntimeTest" --tests "org.nayagram.platform.bot.NGBotAccountGuardTest" --stacktrace || echo "::warning::Unit tests failed or missing"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release AAB
        run: |
          ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release \
            -PRELEASE_STORE_PASSWORD="NayaGramCI@Test2026" \
            -PRELEASE_KEY_PASSWORD="NayaGramCI@Test2026" \
            -PRELEASE_KEY_ALIAS="nayagrampro_key" \
            -PRELEASE_KEYSTORE_PATH="$(pwd)/TMessagesProj/config/nayagrampro.jks" \
            --stacktrace

      - name: Generate Signed Universal APK from AAB
        run: |
          curl -sLO https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          AAB_FILE=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No AAB found"
            find TMessagesProj_App/build -type f \( -name "*.aab" -o -name "*.apk" \) | head -50
            exit 1
          fi
          mkdir -p build_output
          cp "$AAB_FILE" build_output/NayaGram-Release.aab
          java -jar bundletool-all-1.17.2.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=build_output/app.apks \
            --mode=universal \
            --ks=TMessagesProj/config/nayagrampro.jks \
            --ks-pass=pass:'NayaGramCI@Test2026' \
            --ks-key-alias=nayagrampro_key \
            --key-pass=pass:'NayaGramCI@Test2026'
          unzip -p build_output/app.apks universal.apk > build_output/NayaGram-Release.apk
          ls -lh build_output/

      - name: Upload NayaGram Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NayaGram-Release-AAB
          path: build_output/NayaGram-Release.aab
          if-no-files-found: warn

      - name: Upload NayaGram Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NayaGram-Release-APK
          path: build_output/NayaGram-Release.apk
          if-no-files-found: warn
