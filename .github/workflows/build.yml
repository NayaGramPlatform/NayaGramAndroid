name: Build NayaGram Android APK & AAB

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleAfatRelease --stacktrace

      - name: Build Release AAB (App Bundle)
        run: ./gradlew bundleBundleAfat_SDK23Release --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaGramPro-Release-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NayaGramPro-Release-AAB
          path: TMessagesProj_App/build/outputs/bundle/bundleAfat_SDK23Release/*.aab
