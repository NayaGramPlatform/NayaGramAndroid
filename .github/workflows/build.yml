name: Build NayaGram AAB & APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate CI-Only Test Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/nayagrampro.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -alias nayagrampro_key \
            -storepass 'NayaGramCI@Test2026' \
            -keypass 'NayaGramCI@Test2026' \
            -dname "CN=NayaGram CI Test, OU=CI, O=NayaGram Platform, L=Rangpur, ST=Rangpur, C=BD"

      - name: Assemble VoIP Native Libs (Fat Release)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleAfatRelease \
            --stacktrace

      - name: Build Release AAB
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:bundleBundleAfat_SDK23Release \
            -PRELEASE_STORE_PASSWORD="NayaGramCI@Test2026" \
            -PRELEASE_KEY_PASSWORD="NayaGramCI@Test2026" \
            -PRELEASE_KEY_ALIAS="nayagrampro_key" \
            -PRELEASE_KEYSTORE_PATH="$(pwd)/TMessagesProj/config/nayagrampro.jks" \
            --stacktrace

      - name: Generate Signed Universal APK from AAB
        run: |
          curl -sLO https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          AAB_FILE=$(find TMessagesProj_App/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::No AAB found"
            exit 1
          fi
          mkdir -p build_output
          cp "$AAB_FILE" build_output/NayaGram-Release.aab
          java -jar bundletool-all-1.17.2.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=build_output/app.apks \
            --mode=universal \
            --ks=TMessagesProj/config/nayagrampro.jks \
            --ks-pass=pass:'NayaGramCI@Test2026' \
            --ks-key-alias=nayagrampro_key \
            --key-pass=pass:'NayaGramCI@Test2026'
          unzip -p build_output/app.apks universal.apk > build_output/NayaGram-Release.apk
          ls -lh build_output/

          cat > /tmp/nayagram-phone.json << 'EOF'
          {
            "supportedAbis": ["arm64-v8a"],
            "supportedLocales": ["bn", "en"],
            "screenDensity": 480,
            "sdkVersion": 34
          }
          EOF
          java -jar bundletool-all-1.17.2.jar build-apks \
            --bundle="$AAB_FILE" \
            --output=build_output/phone.apks \
            --mode=default \
            --ks=TMessagesProj/config/nayagrampro.jks \
            --ks-pass=pass:'NayaGramCI@Test2026' \
            --ks-key-alias=nayagrampro_key \
            --key-pass=pass:'NayaGramCI@Test2026'
          rm -rf build_output/phone-splits
          mkdir -p build_output/phone-splits
          java -jar bundletool-all-1.17.2.jar extract-apks \
            --apks=build_output/phone.apks \
            --device-spec=/tmp/nayagram-phone.json \
            --output-dir=build_output/phone-splits
          python3 - << 'PY'
          import os
          root = "build_output/phone-splits"
          total = 0
          lines = []
          for name in sorted(os.listdir(root)):
              path = os.path.join(root, name)
              if not os.path.isfile(path):
                  continue
              size = os.path.getsize(path)
              total += size
              lines.append(f"{size/1048576:.1f} MB  {name}")
          text = "\n".join(lines + [f"Play arm64 download ≈ {total/1048576:.1f} MB"])
          print(text)
          open("build_output/play-download-size.txt", "w").write(text + "\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              open(summary, "a").write("\n### Play download (arm64 phone)\n```\n" + text + "\n```\n")
          PY
          ls -lh build_output/phone-splits build_output/play-download-size.txt

      - name: Upload NayaGram Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NayaGram-Release-AAB
          path: build_output/NayaGram-Release.aab
          if-no-files-found: warn

      - name: Upload NayaGram Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NayaGram-Release-APK
          path: build_output/NayaGram-Release.apk
          if-no-files-found: warn
