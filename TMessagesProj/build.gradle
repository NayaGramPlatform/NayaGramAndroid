def configuredTelegramSecret(String name) {
    def value = System.getenv(name)
    if (value == null || value.toString().trim().isEmpty()) {
        if (project.hasProperty(name)) value = project.property(name)
    }
    return value == null ? "" : value.toString().trim()
}

// Placeholders permit Gradle Sync and non-build tasks (such as clean) without
// credentials. The validation task below prevents any app artifact from being built
// unless real, well-formed credentials were supplied.
def resolveTelegramApiId() {
    def value = configuredTelegramSecret("TELEGRAM_API_ID")
    if (value.isEmpty()) return "0"
    if (!(value ==~ /[0-9]+/)) {
        throw new GradleException("TELEGRAM_API_ID must contain digits only.")
    }
    try {
        return Integer.toString(Integer.parseInt(value, 10))
    } catch (NumberFormatException ignored) {
        throw new GradleException("TELEGRAM_API_ID must be a valid positive decimal 32-bit integer.")
    }
}

def resolveTelegramApiHash() {
    def value = configuredTelegramSecret("TELEGRAM_API_HASH")
    if (value.isEmpty()) return "00000000000000000000000000000000"
    if (!(value ==~ /[0-9a-fA-F]{32}/)) {
        throw new GradleException("TELEGRAM_API_HASH must be a 32-character hexadecimal string.")
    }
    return value
}

def validateTelegramApiCredentials = tasks.register("validateTelegramApiCredentials") {
    group = "verification"
    description = "Validates Telegram API credentials before app artifacts are built."
    doLast {
        def apiId = configuredTelegramSecret("TELEGRAM_API_ID")
        def apiHash = configuredTelegramSecret("TELEGRAM_API_HASH")
        if (apiId.isEmpty()) {
            throw new GradleException("Missing TELEGRAM_API_ID. Configure it as a GitHub Actions secret or pass -PTELEGRAM_API_ID.")
        }
        if (!(apiId ==~ /[0-9]+/)) {
            throw new GradleException("TELEGRAM_API_ID must contain digits only.")
        }
        try {
            if (Integer.parseInt(apiId, 10) <= 0) throw new NumberFormatException("not positive")
        } catch (NumberFormatException ignored) {
            throw new GradleException("TELEGRAM_API_ID must be a valid positive decimal 32-bit integer.")
        }
        if (apiHash.isEmpty()) {
            throw new GradleException("Missing TELEGRAM_API_HASH. Configure it as a GitHub Actions secret or pass -PTELEGRAM_API_HASH.")
        }
        if (!(apiHash ==~ /[0-9a-fA-F]{32}/)) {
            throw new GradleException("TELEGRAM_API_HASH must be a 32-character hexadecimal string.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild") {
        task.dependsOn(validateTelegramApiCredentials)
    }
}

android {
    compileSdk 36
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"
    sourceSets.main.jniLibs.srcDirs = ['./jni/']
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']
        multiDexEnabled true
        externalNativeBuild { cmake { version '3.22.1'; arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'; targets 'tmessages.49' } }

        // Telegram API credentials are injected from CI secrets / -P flags; placeholders are sync-only.
        buildConfigField "int", "TELEGRAM_APP_ID", resolveTelegramApiId()
        buildConfigField "String", "TELEGRAM_APP_HASH", "\"" + resolveTelegramApiHash() + "\""
    }
    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_HARDCORE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "5"
        }

        standalone {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }
    buildFeatures {
        androidResources = true
        buildConfig = true
    }
    namespace 'org.telegram.messenger'
}

def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) { def props = new Properties(); props.load(new FileInputStream(propsFile)); return props[propName] } else { return "" }
}
