## Project-wide Gradle settings.
APP_VERSION_CODE=4050
# Public name. versionName is a string, so the NG suffix is valid on Play Store.
APP_VERSION_NAME=4.16.45 NG
APP_PACKAGE=org.nayagram.platform
IS_PRIVATE=false


org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=false
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
# Signing credentials removed for security; supply via environment variables or CI secrets

# Empty defaults so Gradle configuration of every module succeeds.
# Real values come from CI (-P flags) or environment variables.
RELEASE_STORE_PASSWORD=
RELEASE_KEY_PASSWORD=
RELEASE_KEY_ALIAS=
