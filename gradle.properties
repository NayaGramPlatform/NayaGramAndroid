## Project-wide Gradle settings.
APP_VERSION_CODE=4012
# Public name. versionName is a string, so the NG suffix is valid on Play Store.
APP_VERSION_NAME=1.0.0 NG
APP_PACKAGE=org.nayagram.platform
IS_PRIVATE=false


org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
# Signing credentials removed for security; supply via environment variables or CI secrets
